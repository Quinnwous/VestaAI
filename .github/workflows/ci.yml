name: CI

on:
  pull_request:
  push:
    branches: [main]

# Annuleert een lopende run van dezelfde branch/PR zodra er een nieuwe push
# binnenkomt, zodat runners niet op verouderde code blijven draaien.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Zelfde major als productie: Vercel-project vesta-ai staat op Node 24.x
      # (gecontroleerd 1 okt 2026). Gaat Vercel omhoog, dan hier mee.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

# Bewust geen `npm run build`: die heeft productie-env-vars nodig (Supabase,
# Claude, Resend, ...) die hier niet beschikbaar zijn — zie docs/werkwijze.md
# § 4. De echte build en dod:screens draaien na de merge, lokaal of via de
# Vercel-preview/production-deploy.
